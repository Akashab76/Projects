
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>TaskFlow<span>.</span></h1>
        <p>Plan better. Get things done.</p>
    </header>

    <main class="container">
        <!-- Authentication section -->
        <section id="auth-section" class="panel">
            <h2 id="auth-title">Welcome back</h2>
            <p id="auth-subtitle">Log in to manage your tasks.</p>

            <form id="auth-form">
                <div id="username-group" class="hidden">
                    <label for="username">Username</label>
                    <input id="username" type="text"
                           placeholder="Your username">
                </div>

                <label for="email">Email</label>
                <input id="email" type="email"
                       placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input id="password" type="password"
                       placeholder="At least 8 characters" required>

                <button id="auth-button" type="submit">Log In</button>
            </form>

            <p id="auth-message" class="message"></p>

            <p class="switch-text">
                <span id="switch-label">New to TaskFlow?</span>
                <button id="switch-auth" class="text-button"
                        type="button">Create an account</button>
            </p>
        </section>

        <!-- Dashboard section -->
        <section id="dashboard-section" class="hidden">
            <div class="welcome-row">
                <div>
                    <h2>Your dashboard</h2>
                    <p id="welcome-message">Let's get things done.</p>
                </div>
                <button id="logout-button" class="secondary-button">
                    Log Out
                </button>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <p>Total tasks</p>
                    <h3 id="total-count">0</h3>
                </div>
                <div class="stat-card">
                    <p>In progress</p>
                    <h3 id="progress-count">0</h3>
                </div>
                <div class="stat-card">
                    <p>Completed</p>
                    <h3 id="completed-count">0</h3>
                </div>
            </div>

            <section class="panel">
                <h2 id="task-form-title">Create a task</h2>

                <form id="task-form">
                    <label for="task-title">Task title</label>
                    <input id="task-title" type="text"
                           maxlength="100" placeholder="What needs to be done?"
                           required>

                    <label for="task-description">Description</label>
                    <textarea id="task-description"
                              placeholder="Add some details..."></textarea>

                    <div class="form-row">
                        <div>
                            <label for="priority">Priority</label>
                            <select id="priority">
                                <option>Low</option>
                                <option selected>Medium</option>
                                <option>High</option>
                            </select>
                        </div>
                        <div>
                            <label for="status">Status</label>
                            <select id="status">
                                <option selected>Pending</option>
                                <option>In Progress</option>
                                <option>Completed</option>
                            </select>
                        </div>
                    </div>

                    <label for="due-date">Due date</label>
                    <input id="due-date" type="date">

                    <button id="save-task-button" type="submit">
                        Add Task
                    </button>
                    <button id="cancel-edit-button"
                            type="button" class="secondary-button hidden">
                        Cancel Edit
                    </button>
                </form>

                <p id="task-message" class="message"></p>
            </section>

            <section class="task-section">
                <div class="task-heading">
                    <h2>Your tasks</h2>
                    <select id="filter-status" aria-label="Filter tasks">
                        <option value="All">All tasks</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <div id="task-list" class="task-list"></div>
            </section>
        </section>
    </main>

    <footer>
        <p>TaskFlow · Stay focused, one task at a time.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
